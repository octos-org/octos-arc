# octos workspace policy (coding).
#
# The lean coding runtime bootstraps its workspace contract in code
# (`WorkspacePolicy::for_coding` / `coding_default_hooks`); this file only
# carries opt-in overrides for developing octos itself. The media/skill
# spawn_tasks of the upstream fleet build (mofa_*, podcast_generate,
# fm_tts, ...) were removed with those tools.
[validation]
on_turn_end = []
on_source_change = []
on_completion = []

[artifacts]
image_png = "**/*.png"
