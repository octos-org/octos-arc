[package]
name = "octos-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI interface for octos"

[[bin]]
name = "octos"
path = "src/main.rs"

[dependencies]
octos-core = { workspace = true }
octos-agent = { workspace = true }
octos-arc = { workspace = true }
octos-memory = { workspace = true }
octos-llm = { workspace = true }
octos-bus = { workspace = true }
# RFC-2 (issue #1291): `octos skills install` runs the manifest schema
# validator at install time so the operator sees the error before the
# agent loop ever loads the broken manifest. The validator lives in
# `octos-plugin::manifest_validator` and is reached through the
# top-level re-exports.
octos-plugin = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
colored = { workspace = true }
chrono = { workspace = true }
iana-time-zone = { workspace = true }
tokio = { workspace = true }
eyre = { workspace = true }
uuid = { workspace = true }
color-eyre = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rustyline = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
fs2 = { workspace = true }
subtle = { workspace = true, optional = true }
getrandom = "0.2"
constant_time_eq = "0.3"
# Issue #1010 — `extract_token` must percent-decode the `token=` query
# param so a token containing `!`, `+`, `/`, `=`, `:` matches the value
# stored on `AppState.auth_token` / the OTP session store. The
# `Authorization: Bearer …` header path takes the bytes literally —
# HTTP headers are NOT percent-encoded — so the WS path uses RFC 3986
# percent-decode-only semantics (leaves `+` literal) to stay consistent
# with REST.
percent-encoding = "2"
open = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
# #1057: `onboarding/workspace_probe` parses `workspace_policy.toml` to
# surface presence + parse errors during TUI onboarding. The probe re-uses
# `octos_agent::workspace_policy::WorkspacePolicy` as the canonical schema
# and only needs the `toml` deserializer entry point here.
toml = { workspace = true }
keyring = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
# Optional deps gated by feature flags (api)
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
# CancellationToken shared with the rmcp streamable-HTTP service so Ctrl+C tears
# down live SSE sessions instead of blocking graceful shutdown.
tokio-util = { version = "0.7", optional = true }
futures = { workspace = true, optional = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sysinfo = { version = "0.34", optional = true }
redb.workspace = true

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the symlink-safe preview file serve in
# `src/api/preview.rs`. Pinned by issue #996 BLOCKING #1: previously
# `tokio::fs::read` followed symlinks between the canonical-descendant
# check and the read, opening a TOCTOU window.
libc = { workspace = true }
rpassword = { workspace = true }
# `rustix::fs::openat` for the component-by-component path walk in
# `src/api/preview.rs::open_no_follow_walk`. Codex round-2 BLOCKING #1
# (issue #996): the previous `symlink_metadata`-then-`open` ancestor
# walk left a multi-syscall TOCTOU window — an attacker could swap
# any ancestor for a symlink between the stat and the open. Rustix's
# safe `openat` wrapper (workspace-wide `deny(unsafe_code)` rules out
# raw `libc::openat`) anchors each step to a parent fd so the
# relationship survives mid-walk swaps.
# `fs` for the preview walk above; `process` adds
# `rustix::process::test_kill_process` — the kill(pid, 0) liveness probe in
# `src/build_cache/pool.rs` (review #3 D1). Unlike the `kill` binary, the
# syscall returns a distinguishable errno (ESRCH vs EPERM), and unlike
# `libc::kill` it is safe under the workspace-wide deny(unsafe_code).
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }


[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[features]
# chat, ACP and serve use one OUP dispatcher. Minimal library builds can opt
# out, but never silently fall back to independent chat/ACP agent loops.
default = ["api"]
api = ["dep:axum", "dep:tower-http", "dep:tokio-util", "dep:futures", "dep:metrics-exporter-prometheus", "dep:rand", "dep:sysinfo", "dep:subtle"]
git = ["octos-agent/git"]
ast = ["octos-agent/ast"]

[lints]
workspace = true

[dev-dependencies]
tokio-test = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
# Wave-4 B3.4 — enable `test-utils` for octos-llm so the gateway's
# failover-surfacing tests can call `publish_failover_for_subscribers`.
# Production builds don't see this; only `cargo test -p octos-cli`.
# Wave-4 B3.4 — enable `test-utils` for octos-llm so the failover-surfacing
# tests can call `publish_failover_for_subscribers`. Test-only.
octos-llm = { workspace = true, features = ["test-utils"] }
wiremock = { workspace = true }
# WS test client for the api-feature session-ingress tests (issue #296).
tokio-tungstenite = { workspace = true }

