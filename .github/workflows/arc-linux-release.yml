name: ARC Linux x86_64 release

# This is deliberately a standalone, manual publisher for the ARC runtime.
# It does not share triggers with the upstream release workflows: a dispatch
# is the only way to create an ARC Linux release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact branch, tag, or commit to build"
        required: true
        default: "main"
        type: string
      tag:
        description: "Release tag (for example v2.0.3-rc.11-arc.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN: "1.98.0"
  FEATURES: "api,telegram,discord,feishu,twilio,wecom,wecom-bot,audio_mp3"
  SKILL_CRATES: "-p news_fetch -p deep-search -p deep-crawl -p send-email -p account-manager -p clock -p weather -p smart-home"

jobs:
  publish:
    name: Build and publish Linux x86_64 bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2

      - name: Record reproducibility metadata
        run: |
          set -euo pipefail
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RUSTC_VERSION=$(rustc --version)" >> "$GITHUB_ENV"

      - name: Build runtime and bundled tools
        run: |
          set -euo pipefail
          cargo build --locked --release -p octos-cli --features "$FEATURES"
          cargo build --locked --release -p octos-sandbox
          cargo build --locked --release $SKILL_CRATES
          cargo build --locked --release -p voice

      - name: Create bundle
        run: |
          set -euo pipefail
          ./scripts/bundle-release.sh "octos-bundle-x86_64-unknown-linux-gnu.tar.gz"
          sha256sum "octos-bundle-x86_64-unknown-linux-gnu.tar.gz" | tee bundle.sha256
          sha256sum target/release/octos | tee octos.sha256
          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "rustc=$RUSTC_VERSION"
            echo "archive_sha256=$(cut -d ' ' -f 1 bundle.sha256)"
            echo "binary_sha256=$(cut -d ' ' -f 1 octos.sha256)"
            echo "binary_version=$(target/release/octos --version)"
          } | tee release-metadata.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "octos-bundle-x86_64-unknown-linux-gnu.tar.gz" \
            "bundle.sha256" \
            "octos.sha256" \
            "release-metadata.txt" \
            --repo "${{ github.repository }}" \
            --target "$SOURCE_COMMIT" \
            --title "ARC runtime $RELEASE_TAG" \
            --notes "Linux x86_64 ARC runtime bundle.\n\n$(cat release-metadata.txt)"
