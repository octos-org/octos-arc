id: ROOT
name: ARC Dice Smoke Test
type: FOLDER
dependencies: []
description: >-
  Use ARC to build an extremely small dice application for verifying the
  metered competition submission and leaderboard pipeline.
children:
  - id: REQ-1
    name: Roll a six-sided die
    type: ATOMIC
    dependencies: []
    description: >-
      The home page displays a button named "Roll" and a dice value with the
      test id "dice-value". Clicking Roll chooses an integer from 1 through 6
      and displays it. No styling or layout is required.
    scenarios:
      - name: Roll and display a dice value
        steps:
          - keyword: GIVEN
            content: The visitor opens the home page.
          - keyword: THEN
            content: A button named "Roll" is visible.
          - keyword: WHEN
            content: The visitor clicks Roll.
          - keyword: THEN
            content: The dice value displays an integer from 1 through 6.
