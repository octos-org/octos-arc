id: ROOT
name: ARC Counter Evolution Smoke Test
type: FOLDER
dependencies: []
description: >-
  Extend the existing counter application with a reset control without
  breaking its increment and decrement behavior.
children:
  - id: REQ-1
    name: Counter controls
    type: ATOMIC
    dependencies: []
    description: >-
      The home page displays the current count, initially 0, and buttons named
      "Increment" and "Decrement". Increment increases the displayed count by
      one and Decrement decreases it by one. The count display has the test id
      "count". No styling or layout is required.
    scenarios:
      - name: Increment and decrement the count
        steps:
          - keyword: GIVEN
            content: The visitor opens the home page and the displayed count is 0.
          - keyword: THEN
            content: Buttons named "Increment" and "Decrement" are visible.
          - keyword: WHEN
            content: The visitor clicks Increment twice.
          - keyword: THEN
            content: The displayed count is 2.
          - keyword: WHEN
            content: The visitor clicks Decrement three times.
          - keyword: THEN
            content: The displayed count is -1.
  - id: REQ-2
    name: Reset the counter
    type: ATOMIC
    dependencies:
      - REQ-1
    description: >-
      Add a button named "Reset" that sets the displayed count to 0 from any
      current value while preserving the existing counter controls.
    scenarios:
      - name: Reset a changed count
        steps:
          - keyword: GIVEN
            content: The displayed count is not 0.
          - keyword: WHEN
            content: The visitor clicks Reset.
          - keyword: THEN
            content: The displayed count is 0.
