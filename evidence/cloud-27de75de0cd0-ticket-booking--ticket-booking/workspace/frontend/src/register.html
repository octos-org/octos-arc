<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>注册</title>
</head>
<body>
<h1>账户信息</h1>
<form id="register-form" method="POST" action="/api/register" novalidate>
  <div>
    <label for="username">用户名</label>
    <input id="username" type="text" name="username" required>
  </div>
  <div>
    <label for="password">登录密码</label>
    <input id="password" type="password" name="password" required>
    <meter id="password-strength" data-testid="password-strength" aria-label="密码强度" min="0" max="3" value="0"></meter>
  </div>
  <div>
    <label for="confirm-password">确认密码</label>
    <input id="confirm-password" type="password" name="confirmPassword" required>
  </div>
  <div>
    <label for="document-type">证件类型</label>
    <select id="document-type" name="documentType" required>
      <option value="">请选择证件类型</option>
      <option value="passport">护照</option>
      <option value="id_card">居民身份证</option>
      <option value="hk_macau">港澳居民来往内地通行证</option>
      <option value="tw_mainland">台湾居民来往大陆通行证</option>
      <option value="foreigner">外国人永久居留身份证</option>
    </select>
  </div>
  <div>
    <label for="name">姓名</label>
    <input id="name" type="text" name="name" required>
  </div>
  <div>
    <label for="document-number">证件号码</label>
    <input id="document-number" type="text" name="documentNumber" required>
  </div>
  <div>
    <label for="discount-type">优惠（待）类型</label>
    <select id="discount-type" name="discountType" required>
      <option value="">请选择乘客类型</option>
      <option value="adult">成人</option>
      <option value="child">儿童</option>
      <option value="student">学生</option>
      <option value="disabled">残疾军人</option>
      <option value="other">其他优惠类型</option>
    </select>
  </div>
  <div>
    <label for="email">邮箱</label>
    <input id="email" type="email" name="email">
  </div>
  <div>
    <label for="country-code">国家/地区代码</label>
    <select id="country-code" name="countryCode" required>
      <option value="+86">+86</option>
      <option value="+84">+84</option>
      <option value="+1">+1</option>
      <option value="+44">+44</option>
    </select>
  </div>
  <div>
    <label for="mobile-number">手机号</label>
    <input id="mobile-number" type="text" name="mobileNumber" required>
  </div>
  <div>
    <label>
      <input type="checkbox" name="terms"> 我同意《服务条款》和《隐私政策》
    </label>
  </div>
  <div role="alert" id="alert">__ERROR__</div>
  <button type="submit">下一步</button>
</form>
<p><a href="/login">Login</a></p>
<script>
  var passwordInput = document.getElementById('password');
  var strengthMeter = document.getElementById('password-strength');
  if (passwordInput) passwordInput.addEventListener('input', function() {
    var score = 0;
    var pw = passwordInput.value;
    if (pw.length >= 8) score++;
    if (pw.length >= 12) score++;
    if (/[a-z]/.test(pw) && /[A-Z]/.test(pw) && /\d/.test(pw) && /[^A-Za-z0-9]/.test(pw)) score++;
    strengthMeter.setAttribute('value', score);
  });
  document.getElementById('register-form').addEventListener('submit', function(e) {
    var alert = document.getElementById('alert');
    if (alert && alert.textContent) { alert.textContent = ''; }
  });
</script>
</body>
</html>
