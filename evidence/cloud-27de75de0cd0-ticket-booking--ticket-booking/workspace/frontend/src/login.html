<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>登录</title>
</head>
<body>
<h1>登录</h1>
<form id="login-form" method="POST" action="/api/login" novalidate>
  <div>
    <label for="username-or-email">用户名或邮箱</label>
    <input id="username-or-email" type="text" name="usernameOrEmail" required>
  </div>
  <div>
    <label for="password">密码</label>
    <input id="password" type="password" name="password" required>
  </div>
  <div role="alert" id="alert">__ERROR__</div>
  <button type="submit">登录</button>
</form>
</body>
</html>
