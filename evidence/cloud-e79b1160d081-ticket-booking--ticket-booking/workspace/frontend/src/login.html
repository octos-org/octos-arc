<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录</title>
</head>
<body>
<h2>登录</h2>
<div role="alert" id="error-message"></div>
<form id="login-form" novalidate>
<div>
<label for="username-or-email">用户名或邮箱</label>
<input type="text" id="username-or-email" name="usernameOrEmail" required>
</div>
<div>
<label for="password">密码</label>
<input type="password" id="password" name="password" required>
</div>
<button type="submit" id="login-button">登录</button>
</form>
<script>
const form = document.getElementById('login-form');
const errorContainer = document.getElementById('error-message');

form.addEventListener('submit', async function(event) {
  event.preventDefault();
  errorContainer.textContent = '';
  const data = {
    usernameOrEmail: document.getElementById('username-or-email').value,
    password: document.getElementById('password').value
  };
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      const body = await res.json();
      errorContainer.textContent = body.error;
    }
  } catch (e) {
    errorContainer.textContent = '网络错误';
  }
});
</script>
</body>
</html>
