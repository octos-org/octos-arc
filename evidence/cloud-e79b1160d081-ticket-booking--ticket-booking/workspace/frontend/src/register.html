<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>注册</title>
</head>
<body>
<h2>账户信息</h2>
<div role="alert" id="error-message"></div>
<form id="registration-form" novalidate>
<div>
<label for="username">用户名</label>
<input type="text" id="username" name="username" required>
</div>
<div>
<label for="password">登录密码</label>
<input type="password" id="password" name="password" required>
<div id="password-strength" role="meter" aria-label="密码强度" data-testid="password-strength"></div>
</div>
<div>
<label for="confirm-password">确认密码</label>
<input type="password" id="confirm-password" name="confirmPassword" required>
</div>
<div>
<label for="document-type">证件类型</label>
<select id="document-type" name="documentType" required>
<option value="">请选择证件类型</option>
<option value="resident_id">居民身份证</option>
<option value="passport">护照</option>
<option value="hk_macau">港澳居民来往内地通行证</option>
<option value="taiwan">台湾居民来往大陆通行证</option>
<option value="foreign_permanent">外国人永久居留身份证</option>
</select>
</div>
<div>
<label for="name">姓名</label>
<input type="text" id="name" name="name" required>
</div>
<div>
<label for="document-number">证件号码</label>
<input type="text" id="document-number" name="documentNumber" required>
</div>
<div>
<label for="discount-type">优惠（待）类型</label>
<select id="discount-type" name="discountType" required>
<option value="">请选择乘客类型</option>
<option value="adult">成人</option>
<option value="child">儿童</option>
<option value="student">学生</option>
<option value="disabled_soldier">残疾军人</option>
<option value="other">其他优惠类型</option>
</select>
</div>
<div>
<label for="email">邮箱</label>
<input type="email" id="email" name="email">
</div>
<div>
<label for="country-code">国家/地区代码</label>
<select id="country-code" name="countryCode" required>
<option value="+86" selected>+86</option>
<option value="+84">+84</option>
<option value="+1">+1</option>
<option value="+81">+81</option>
</select>
</div>
<div>
<label for="mobile">手机号</label>
<input type="text" id="mobile" name="mobile" required>
</div>
<div>
<label>
<input type="checkbox" id="terms-checkbox" name="terms" value="true">
我已阅读并同意服务条款和隐私政策
</label>
</div>
<button type="submit" id="next-step">下一步</button>
</form>
<script>
const form = document.getElementById('registration-form');
const errorContainer = document.getElementById('error-message');
const passwordInput = document.getElementById('password');
const strengthIndicator = document.getElementById('password-strength');

passwordInput.addEventListener('input', function() {
  const password = this.value;
  if (password.length === 0) {
    strengthIndicator.innerHTML = '';
  } else if (password.length < 8) {
    strengthIndicator.innerHTML = '<span>weak</span>';
  } else if (password.length < 12 || !/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9])/.test(password)) {
    strengthIndicator.innerHTML = '<span>medium</span>';
  } else {
    strengthIndicator.innerHTML = '<span>strong</span>';
  }
});

form.addEventListener('submit', async function(event) {
  event.preventDefault();
  errorContainer.textContent = '';
  const formData = new FormData(form);
  const data = {
    username: formData.get('username'),
    password: formData.get('password'),
    confirmPassword: formData.get('confirmPassword'),
    documentType: formData.get('documentType'),
    name: formData.get('name'),
    documentNumber: formData.get('documentNumber'),
    discountType: formData.get('discountType'),
    email: formData.get('email'),
    countryCode: formData.get('countryCode'),
    mobile: formData.get('mobile'),
    terms: formData.get('terms') === 'true'
  };
  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      const body = await res.json();
      errorContainer.textContent = body.error;
    }
  } catch (e) {
    errorContainer.textContent = '网络错误';
  }
});
</script>
</body>
</html>
