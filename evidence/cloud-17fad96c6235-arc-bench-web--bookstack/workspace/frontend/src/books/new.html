<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Book - BookStack</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top-nav">
    <nav class="nav-inner" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="BookStack">
        <span class="brand-logo">BookStack</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="/shelves">Shelves</a>
        <a class="nav-link" href="/books">Books</a>
      </div>
      <div class="nav-right">
        <form class="search-form" action="/search" method="get" role="search">
          <label for="search-input" class="visually-hidden">Search</label>
          <input id="search-input" name="q" type="search" placeholder="Search" autocomplete="off" />
        </form>
        <!--__HEADER_RIGHT__-->
      </div>
    </nav>
  </header>

  <main class="container">
    <p class="breadcrumb"><a class="crumb-link" href="/books">Books</a></p>

    <section class="form-card">
      <h1 class="form-title">New Book</h1>
      <p class="tagline">Create a new book in your knowledge base.</p>

      <form class="book-form" id="new-book-form" novalidate>
        <div class="form-error" id="form-error" role="alert" hidden></div>

        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <input id="description" name="description" type="text" autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="tags">Tags</label>
          <input id="tags" name="tags" type="text" autocomplete="off" />
        </div>

        <div class="form-actions">
          <a class="cancel-btn" href="/books">Cancel</a>
          <button class="submit-btn save-btn" type="submit">Save Book</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span>BookStack Knowledge Base System</span>
  </footer>
  <script>
    (function () {
      'use strict';
      var form = document.getElementById('new-book-form');
      var errorBox = document.getElementById('form-error');
      if (!form) return;

      form.addEventListener('submit', function (evt) {
        evt.preventDefault();
        var name = document.getElementById('name').value.trim();
        var description = document.getElementById('description').value.trim();
        var tags = document.getElementById('tags').value.trim();

        if (!name) {
          errorBox.textContent = 'Name is required.';
          errorBox.hidden = false;
          return;
        }

        errorBox.hidden = true;

        var payload = {
          name: name,
          description: description,
          tags: tags ? tags.split(',').map(function (t) { return t.trim(); }).filter(Boolean) : []
        };

        fetch('/api/books', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(function (res) {
            if (res.ok) {
              return res.json().then(function (data) {
                window.location.href = '/books/' + data.book.id;
              });
            } else {
              return res.json().then(function (data) {
                throw new Error((data && data.error) || 'Unable to save book.');
              });
            }
          })
          .catch(function (err) {
            errorBox.textContent = err.message || 'Unable to save book.';
            errorBox.hidden = false;
          });
      });
    })();
  </script>
  <script src="/app.js"></script>

</body>
</html>
