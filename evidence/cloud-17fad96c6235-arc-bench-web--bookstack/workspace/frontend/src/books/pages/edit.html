<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Page - BookStack</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top-nav">
    <nav class="nav-inner" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="BookStack">
        <span class="brand-logo">BookStack</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="/shelves">Shelves</a>
        <a class="nav-link" href="/books">Books</a>
      </div>
      <div class="nav-right">
        <form class="search-form" action="/search" method="get" role="search">
          <label for="search-input" class="visually-hidden">Search</label>
          <input id="search-input" name="q" type="search" placeholder="Search" autocomplete="off" />
        </form>
        <!--__HEADER_RIGHT__-->
      </div>
    </nav>
  </header>

  <main class="container">
    <p class="breadcrumb"><a class="crumb-link" href="/books">Books</a></p>

    <section class="form-card">
      <h1 class="form-title">Edit Page</h1>
      <p class="tagline">Edit the existing page in this book.</p>

      <form class="book-form" id="edit-page-form" novalidate>
        <div class="form-error" id="form-error" role="alert" hidden></div>

        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" value="__PAGE_NAME__" autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" name="content" rows="12" autocomplete="off">__PAGE_CONTENT__</textarea>
        </div>

        <div class="form-actions">
          <a class="cancel-btn" id="cancel-link" href="__CANCEL_HREF__">Cancel</a>
          <button class="submit-btn save-btn" type="submit">Save Page</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span>BookStack Knowledge Base System</span>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
