<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Details - BookStack</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top-nav">
    <nav class="nav-inner" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="BookStack">
        <span class="brand-logo">BookStack</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="/shelves">Shelves</a>
        <a class="nav-link" href="/books">Books</a>
      </div>
      <div class="nav-right">
        <form class="search-form" action="/search" method="get" role="search">
          <label for="search-input" class="visually-hidden">Search</label>
          <input id="search-input" name="q" type="search" placeholder="Search" autocomplete="off" />
        </form>
        <!--__HEADER_RIGHT__-->
      </div>
    </nav>
  </header>

  <main class="container">
    <p class="breadcrumb"><a class="crumb-link" href="/books">Books</a></p>

    <section class="detail-header">
      <h1 class="detail-title">__BOOK_NAME__</h1>
      <p class="detail-desc">__BOOK_DESC__</p>
    </section>

    <section class="action-panel" aria-label="Actions">
      <a class="action-btn" href="__NEW_PAGE_HREF__">New Page</a>
      <a class="action-btn" href="__NEW_CHAPTER_HREF__">New Chapter</a>
      <a class="action-btn" href="__EDIT_HREF__">Edit</a>
      <a class="action-btn danger-btn" href="__DELETE_HREF__">Delete</a>
      <!--__FAVORITE_ACTION__-->
    </section>

    <section class="content-card">
      <h2 class="section-title">About this book</h2>
      <p class="detail-meta">Created: __BOOK_CREATED__</p>
    </section>

    <section class="content-card">
      <h2 class="section-title">Chapters</h2>
      <!--__CHAPTER_LIST__-->
    </section>

    <section class="content-card">
      <h2 class="section-title">Pages</h2>
      <!--__PAGE_LIST__-->
    </section>
  </main>

  <footer class="site-footer">
    <span>BookStack Knowledge Base System</span>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
